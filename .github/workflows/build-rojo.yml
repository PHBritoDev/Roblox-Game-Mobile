name: Construir prototipo Roblox (Rojo)
on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'assets/**'
      - 'default.project.json'
      - 'mobile-premium.project.json'
      - 'mobile-premium.project.json'
      - '.github/workflows/build-rojo.yml'
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'assets/**'
      - 'default.project.json'
      - '.github/workflows/build-rojo.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reutilizar compilador Rojo entre builds
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/rojo
          key: rojo-7.6.1-${{ runner.os }}-v1
      - name: Instalar Rojo 7.6.1 se necessario
        run: |
          if ! command -v rojo >/dev/null 2>&1; then
            cargo install rojo --version 7.6.1 --locked
          fi
      - name: Gerar arquivo do prototipo
        run: rojo build default.project.json -o DreamcorePrototype.rbxlx
      - name: Verificar bootstrap leve e preservar variante com biblioteca integral
        run: |
          rojo build bundled.project.json -o DreamcoreBundled.rbxlx
          python3 tools/roblox-qa/verify_bootstrap.py DreamcorePrototype.rbxlx DreamcoreBundled.rbxlx
      - name: Gerar e auditar variante premium leve, pronta para publicacao
        run: |
          rojo build mobile-premium.project.json -o DreamcorePremium.rbxlx
          python3 tools/roblox-qa/verify_mobile_premium.py DreamcorePremium.rbxlx
      - name: Provar que o Place tem iluminacao Realistic
        run: |
          grep -Fq '<token name="LightingStyle">0</token>' DreamcorePrototype.rbxlx
          grep -Fq '<bool name="PrioritizeLightingQuality">true</bool>' DreamcorePrototype.rbxlx
          grep -Fq '<bool name="GlobalShadows">true</bool>' DreamcorePrototype.rbxlx
          echo 'Lighting Realistic e prioridade de sombras presentes no arquivo do Roblox.'
      - name: Auditar biblioteca incluida no Place
        run: python3 tools/roblox-qa/audit_bundled_assets.py
      - name: Publicar artefato para revisao
        uses: actions/upload-artifact@v4
        with:
          name: DreamcorePrototype
          path: |
            DreamcorePrototype.rbxlx
            DreamcoreBundled.rbxlx
            DreamcorePremium.rbxlx
          if-no-files-found: error
