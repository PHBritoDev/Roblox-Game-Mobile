name: Enviar mapa para Roblox (manual)
on:
  workflow_dispatch:
    inputs:
      universo_id:
        description: "Universe ID da experiencia de teste existente"
        required: true
        type: string
      lugar_id:
        description: "Place ID do lugar de teste existente"
        required: true
        type: string
      modo:
        description: "Saved prepara uma versao; Published libera a versao para a experiencia"
        required: true
        type: choice
        default: Saved
        options:
          - Saved
          - Published

permissions:
  contents: read

concurrency:
  group: roblox-deploy-teste
  cancel-in-progress: false

jobs:
  enviar:
    runs-on: ubuntu-latest
    environment: roblox-teste
    steps:
      - name: Conferir entradas e configuracao
        env:
          UNIVERSE: ${{ inputs.universo_id }}
          PLACE: ${{ inputs.lugar_id }}
          ROBLOX_API_KEY: ${{ secrets.ROBLOX_API_KEY }}
        run: |
          set -euo pipefail
          [[ "$UNIVERSE" =~ ^[0-9]+$ ]] || { echo "Universe ID invalido"; exit 1; }
          [[ "$PLACE" =~ ^[0-9]+$ ]] || { echo "Place ID invalido"; exit 1; }
          if [ -z "$ROBLOX_API_KEY" ]; then
            echo "Configure ROBLOX_API_KEY em GitHub Settings > Secrets and variables > Actions."
            exit 1
          fi
      - uses: actions/checkout@v4
      - name: Instalar Rojo
        run: cargo install rojo --version 7.6.1 --locked
      - name: Construir arquivo do mapa
        run: rojo build default.project.json -o DreamcorePrototype.rbxlx
      - name: Enviar versao ao lugar existente
        env:
          UNIVERSE: ${{ inputs.universo_id }}
          PLACE: ${{ inputs.lugar_id }}
          MODE: ${{ inputs.modo }}
          ROBLOX_API_KEY: ${{ secrets.ROBLOX_API_KEY }}
        run: |
          set -euo pipefail
          status=$(curl --show-error --silent --retry 2 \
            --request POST \
            "https://apis.roblox.com/universes/v1/${UNIVERSE}/places/${PLACE}/versions?versionType=${MODE}" \
            --header "x-api-key: ${ROBLOX_API_KEY}" \
            --header "Content-Type: application/xml" \
            --data-binary @DreamcorePrototype.rbxlx \
            --output resultado-publicacao.json \
            --write-out '%{http_code}')
          echo "Status HTTP da API Roblox: ${status}"
          if [[ "${status}" -lt 200 || "${status}" -ge 300 ]]; then
            python3 - <<'PY'
          import json, os
          from pathlib import Path
          raw = Path("resultado-publicacao.json").read_text(errors="replace")
          try:
              data = json.loads(raw)
              if isinstance(data, dict):
                  errs = data.get("errors")
                  if isinstance(errs, list):
                      msg = "; ".join(str(e.get("message", e.get("code", "erro"))) for e in errs if isinstance(e, dict))
                  else:
                      msg = str(data.get("message", data.get("error", "Resposta sem mensagem")))
              else:
                  msg = "Formato inesperado de resposta"
          except ValueError:
              msg = "Resposta nao-JSON recebida; consulte as permissoes Open Cloud"
          key = os.environ.get("ROBLOX_API_KEY", "")
          if key:
              msg = msg.replace(key, "[CHAVE OCULTA]")
          print("Diagnostico Roblox:", msg[:500])
          PY
            exit 1
          fi
          echo "Publicacao aceita pelo Roblox."
          python3 - <<'PY'
          import json
          with open("resultado-publicacao.json") as file:
              result = json.load(file)
          print("Numero da versao:", result.get("versionNumber", "nao informado"))
          PY
      - name: Salvar comprovante
        uses: actions/upload-artifact@v4
        with:
          name: resultado-envio-roblox
          path: resultado-publicacao.json
          if-no-files-found: error
