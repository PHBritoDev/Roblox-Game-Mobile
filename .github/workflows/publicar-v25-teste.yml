name: Publicar V25 para teste Roblox (pedido unico)
on:
  push:
    branches: [main]
    paths:
      - 'deploy-requests/publicar-mundo1-v25.txt'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: roblox-deploy-teste
  cancel-in-progress: false
jobs:
  publicar:
    name: Validar e publicar mapa completo no Place de teste
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: roblox-teste
    env:
      UNIVERSE: '2660433574'
      PLACE: '6947682498'
      ROBLOX_API_KEY: ${{ secrets.ROBLOX_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Confirmar pedido explicito e alvo
        run: |
          set -euo pipefail
          grep -Fxq 'AUTORIZADO PUBLICAR V25 NO PLACE 6947682498' deploy-requests/publicar-mundo1-v25.txt
          [[ "$UNIVERSE" == '2660433574' && "$PLACE" == '6947682498' ]]
          test -n "$ROBLOX_API_KEY" || { echo 'Chave Roblox ausente no ambiente roblox-teste'; exit 1; }
          test -f src/server/DreamcoreWorld.server.luau
      - name: Instalar Rojo
        run: cargo install rojo --version 7.6.1 --locked
      - name: Build Roblox
        run: rojo build default.project.json -o DreamcoreV25.rbxlx
      - name: Publicar na experiencia de teste
        run: |
          set -euo pipefail
          status=$(curl --silent --show-error --retry 2 --request POST \
            "https://apis.roblox.com/universes/v1/${UNIVERSE}/places/${PLACE}/versions?versionType=Published" \
            --header "x-api-key: ${ROBLOX_API_KEY}" \
            --header "Content-Type: application/xml" \
            --data-binary @DreamcoreV25.rbxlx \
            --output roblox-result.json --write-out '%{http_code}')
          echo "Roblox HTTP: $status"
          if [[ "$status" -lt 200 || "$status" -ge 300 ]]; then
            python3 - <<'PY'
          import json
          try:
              d=json.load(open('roblox-result.json'))
              print('Roblox recusou:',str(d.get('errors',d.get('message','erro sem mensagem')))[:450])
          except Exception:
              print('Roblox recusou envio (resposta nao JSON)')
          PY
            exit 1
          fi
          python3 - <<'PY'
          import json
          d=json.load(open('roblox-result.json'))
          print('Versao Roblox:',d.get('versionNumber','desconhecida'))
          PY
      - name: Evidencia da publicacao
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resultado-publicacao-v25
          path: roblox-result.json
          if-no-files-found: warn
