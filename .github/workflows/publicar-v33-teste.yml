name: Publicar V33 no Roblox teste (solicitacao explicita)
on:
  push:
    branches: [main]
    paths:
      - 'deploy-requests/publicar-mundo1-v33.txt'
permissions:
  contents: read
concurrency:
  group: roblox-deploy-teste
  cancel-in-progress: false
jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: roblox-teste
    env:
      UNIVERSE: '2660433574'
      PLACE: '6947682498'
      ROBLOX_API_KEY: ${{ secrets.ROBLOX_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Validar autorizacao e alvo de TESTE
        shell: bash
        run: |
          set -euo pipefail
          grep -Fxq 'AUTORIZADO PUBLICAR V33 NO PLACE DE TESTE 6947682498' deploy-requests/publicar-mundo1-v33.txt
          grep -Fxq 'BASE_VALIDADA=2d264e2c699b909b804430139598f9572432ca37' deploy-requests/publicar-mundo1-v33.txt
          git merge-base --is-ancestor 2d264e2c699b909b804430139598f9572432ca37 HEAD
          test -n "$ROBLOX_API_KEY"
          grep -Fq 'SetAttribute("ForestVersion",33)' src/server/DreamcoreWorld.server.luau
          test -f assets/ForestLibrary.rbxmx
          test -f assets/forest-manifest.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Auditoria de assets e testes
        run: |
          set -euo pipefail
          python tools/roblox-qa/audit.py
          python tools/roblox-qa/audit_bundled_assets.py
          python -m unittest discover -s tools/roblox-qa -p 'test_*.py'
      - name: Instalar compilador Rojo
        run: |
          if ! command -v rojo >/dev/null 2>&1; then cargo install rojo --version 7.6.1 --locked; fi
      - name: Compilar place
        run: |
          set -euo pipefail
          rojo build default.project.json -o DreamcoreV33.rbxlx
          test -s DreamcoreV33.rbxlx
          grep -Fq 'ForestLibrary' DreamcoreV33.rbxlx
      - name: Publicar no Roblox TESTE
        shell: bash
        run: |
          set -euo pipefail
          status=$(curl --silent --show-error --retry 2 --request POST \
            "https://apis.roblox.com/universes/v1/${UNIVERSE}/places/${PLACE}/versions?versionType=Published" \
            --header "x-api-key: ${ROBLOX_API_KEY}" \
            --header "Content-Type: application/xml" \
            --data-binary @DreamcoreV33.rbxlx \
            --output roblox-result-v33.json --write-out '%{http_code}')
          echo "Roblox HTTP: $status"
          if [[ "$status" -lt 200 || "$status" -ge 300 ]]; then
            python3 -c 'import json; d=json.load(open("roblox-result-v33.json")); print(str(d.get("errors",d.get("message","Erro Roblox")))[:450])'
            exit 1
          fi
          python3 -c 'import json; d=json.load(open("roblox-result-v33.json")); v=d.get("versionNumber"); assert isinstance(v,int) and v>0, d; print("PUBLICACAO CONFIRMADA, versao Roblox:",v)'
      - name: Arquivar comprovante
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resultado-publicacao-v33
          path: roblox-result-v33.json
          if-no-files-found: warn
